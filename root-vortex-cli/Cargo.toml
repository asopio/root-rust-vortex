[package]
name = "root-vortex-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for converting ROOT files to the Vortex format"
license = "MIT"

[[bin]]
name = "root-vortex"
path = "src/main.rs"

[dependencies]
root-vortex = { path = "../root-vortex" }
oxyroot = "0.1.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
