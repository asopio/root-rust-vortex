[package]
name = "root-vortex"
version = "0.1.0"
edition = "2021"
description = "Convert ROOT (CERN) files and trees to the Vortex columnar format"
license = "MIT"
repository = "https://github.com/asopio/root-rust-vortex"

[dependencies]
# main vortex umbrella crate; includes vortex-file via the default 'files' feature
vortex = "0.71.0"
# vortex-io exposes the single-threaded blocking runtime
vortex-io = "0.71.0"
anyhow = "1"
chrono = "0.4"
downcast = "0.11.0"
flate2 = "1"
itertools = "0.12"
lazy_static = "1.4.0"
log = "0.4"
lz4 = "1"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
paste = "1.0"
regex = "1"
trait-set = "0.3.0"
uuid = "1"
xz2 = "0.1"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
